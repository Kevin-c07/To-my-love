<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you ♥</title>
<style>
:root{--bg:#fff1f4;--card:#ffffff;--ink:#4a1d2b;--soft:#8a4a5d;--pink:#e8456b;--line:#f4c6d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1015;--card:#2a1820;--ink:#ffe3ea;--soft:#e6a9ba;--pink:#ff6f91;--line:#4a2a35}}
:root[data-theme="dark"]{--bg:#1d1015;--card:#2a1820;--ink:#ffe3ea;--soft:#e6a9ba;--pink:#ff6f91;--line:#4a2a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float span{position:absolute;bottom:-40px;color:var(--pink);opacity:.35;animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
.card{position:relative;max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 26px;text-align:center;box-shadow:0 10px 40px rgba(232,69,107,.15)}
.screen{display:none}.screen.on{display:block;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big{font-size:56px;color:var(--pink);animation:beat 1.4s ease-in-out infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
h1{font-size:26px;margin:10px 0 14px;font-weight:600}
p.sub{color:var(--soft);font-size:16px;margin:0 0 14px}
#msg{font-size:18px;line-height:1.6;color:var(--soft);white-space:pre-wrap;margin:0 0 18px;text-align:left}
#from{font-style:italic;color:var(--pink);font-size:18px;margin-top:6px}
button,input,textarea{font:inherit}
.btn{margin:12px 5px 0;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:10px 26px;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:16px}
#code{text-align:center;font-size:24px;letter-spacing:4px;max-width:240px}
textarea{min-height:150px;resize:vertical}
label{display:block;text-align:left;font-size:13px;color:var(--soft);margin-top:8px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#err,#nomsg{min-height:22px;color:var(--pink);font-size:14px;margin:8px 0 0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 22px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:rotate(-2deg)}
.gal img:nth-child(even){transform:rotate(2deg);margin-top:10px}
#editBtn{display:none}
</style>
<style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<div class="float" id="fl" aria-hidden="true"></div>
<div class="card">
  <div class="screen on" id="gate">
    <div class="big">🔒</div>
    <h1>Just for you</h1>
    <p class="sub">Type our special date to open</p>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="__/__/__">
    <div id="err"></div>
    <button class="btn" id="go">Unlock</button>
  </div>
  <div class="screen" id="ask">
    <div class="big">♥</div>
    <h1>Hey you…</h1>
    <p class="sub">I made something for you. Do you want to proceed?</p>
    <button class="btn" id="yes">Yes</button>
    <button class="btn ghost" id="no">No</button>
    <div id="nomsg"></div>
  </div>
  <div class="screen" id="main">
    <div id="view" style="">

<script id="state" type="application/json">{"title":"Hello my pretty girl","message":"I know today may be not your day which is why your reading this. You may be feeling frustrated, sad, confused, annoyed. But remember I'm always here for you even on the days you are feeling sad. \n\nI wanted to make you this as a way for reassurance and that you know that your strong and you got this. Whatever is making you upset: Exams, Me, Family, Work, Vicky (i don't rate her as well) or anything else. You truly mean a lot to me and I'm happy that i found you. The way we met will always be my favourite memory. The fact that we both went to the same concert, like everything right now wouldn't exist but because of that day it does now. I'm truly grateful for you and i want you to read this on the days you don't feel yourself. \n\nPlease don't stress or give up my love. The last thing i want to see from you is cry especially if it's not happy tears and your crying because your upset. \n\nWhatever the reason why your reading this today. I just want you to remember that you will always be with me and that I'll make you the happiest girl in the world.  \n","from":"Your favourite person, Kevin"}</script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
function render(){$('t').textContent=S.title;$('msg').textContent=S.message;$('from').textContent=S.from}
render();
const fl=$('fl');
for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent='♥';
s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*26)+'px';
s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';fl.appendChild(s)}
function tryCode(){
  const d=$('code').value.replace(/\D/g,'');
  if(d==='091026'||d==='91026'){$('err').textContent='';show('ask')}
  else{$('err').textContent='Hmm, not quite. Think of our special date ♥';
    const c=$('code');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
}
$('go').onclick=tryCode;
$('code').onkeydown=e=>{if(e.key==='Enter')tryCode()};
$('yes').onclick=()=>show('main');
$('no').onclick=()=>{$('nomsg').textContent='No rush, I’ll be here whenever you’re ready ♥'};
(async()=>{
  let art=null,user=null;
  try{art=await claude.use('artifact');user=await claude.use('user')}catch(e){}
  if(!art||!user||!user.canEdit())return;
  $('editBtn').style.display='inline-block';
  $('editBtn').onclick=()=>{$('et').value=S.title;$('em').value=S.message;$('ef').value=S.from;
    $('view').style.display='none';$('edit').style.display='block'};
  $('cancel').onclick=()=>{$('edit').style.display='none';$('view').style.display='block'};
  $('save').onclick=async()=>{
    S.title=$('et').value;S.message=$('em').value;S.from=$('ef').value;
    $('status').textContent='Saving…';
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
    c.querySelector('#fl').innerHTML='';
    ['#t','#msg','#from','#err','#nomsg'].forEach(s=>c.querySelector(s).textContent='');
    c.querySelector('#code').removeAttribute('value');
    c.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='gate'));
    c.querySelector('#editBtn').style.display='';
    c.querySelector('#view').style.display='';c.querySelector('#edit').style.display='none';
    try{await art.publish('<!doctype html>\n'+c.outerHTML)}
    catch(e){$('status').textContent='Couldn’t save ('+(e.code||'error')+')'}
  };
})();
</script>
